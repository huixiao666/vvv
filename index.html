            function makeUniqueTag(baseName, usedTags) {

                if (!candidate) candidate = 'node';
                let finalTag = candidate;
                let counter = 1;
                while (usedTags.has(finalTag)) {
                    finalTag = `${candidate}-${counter}`;
                    counter++;
                }
                usedTags.add(finalTag);
                return finalTag;

            function parseVless(url) {
                let main = url.substring(8);
                let fragment = '';
                const hash = main.indexOf('#');
                if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1));
                    main = main.substring(0, hash); }
                const qIdx = main.indexOf('?');
                let serverPart = main,
                    query = '';
                if (qIdx !== -1) { serverPart = main.substring(0, qIdx);
                    query = main.substring(qIdx + 1); }
                const at = serverPart.indexOf('@');
                if (at === -1) throw new Error('Invalid VLESS');
                const uuid = serverPart.substring(0, at);
                const hostPort = serverPart.substring(at + 1);
                let server, port;
                const col = hostPort.lastIndexOf(':');
                if (col !== -1) { server = hostPort.substring(0, col);
                    port = parseInt(hostPort.substring(col + 1)); } else { server = hostPort;
                    port = 443; }
                const params = new URLSearchParams(query);
                const type = params.get('type') || 'tcp';
                const security = params.get('security') || 'none';
                const flow = params.get('flow') || '';
                const sni = params.get('sni') || params.get('peer') || server;
                const alpn = params.get('alpn');
                const fp = params.get('fp') || (security === 'tls' ? 'chrome' : undefined);
                let path = params.get('path') || '/';
                try { path = decodeURIComponent(path); } catch (e) {}
                const host = params.get('host') || sni;
                const serviceName = params.get('serviceName') || '';
                const pbk = params.get('pbk') || '';
                const sid = params.get('sid') || '';

                const rawTag = fragment || `${server}:${port}`;
                const node = {
                    _rawTag: rawTag,
                    type: 'vless',
                    server,
                    server_port: port,
                    uuid,
                    domain_resolver: 'alidns-quic'
                };
                if (flow) node.flow = flow;
                if (type !== 'tcp') {
                    const transport = { type };
                    if (type === 'ws') { transport.path = path; if (host) transport.headers = { Host: host }; } else if (
                        type === 'grpc') transport.service_name = serviceName;
                    else if (type === 'httpupgrade') { transport.path = path; if (host) transport.host = host; }
                    node.transport = transport;

                };
                if (obfs) {
                    node.obfs = { type: obfs };
                    if (obfsPassword) node.obfs.password = obfsPassword;
                }
                return node;
            }

            function parseLine(line) {
                line = line.trim();
                if (!line) return null;
                try {
                    if (line.startsWith('vless://')) return parseVless(line);
                    if (line.startsWith('vmess://')) return parseVmess(line);
                    if (line.startsWith('trojan://')) return parseTrojan(line);
                    if (line.startsWith('ss://')) return parseShadowsocks(line);
                    if (line.startsWith('hysteria2://') || line.startsWith('hy2://')) return parseHysteria2(line);
                } catch (e) {
                    console.warn('解析失败:', line, e);
                    return null;
                }
                return null;
            }

            // ========== 构建 outbounds (动态填充) ==========
            function buildOutbounds(rawNodes) {
                const usedTags = new Set([
                    'DIRECT', 'PROXY', '🟢 自动-测速', '🔵 自动-稳定',
                    'GLOBAL', 'CN', 'Final', 'REJECT-DROP'
                ]);
                const finalNodes = [];
                for (let raw of rawNodes) {
                    const baseTag = raw._rawTag || 'node';
                    delete raw._rawTag;
                    const uniqueTag = makeUniqueTag(baseTag, usedTags);
                    raw.tag = uniqueTag;
                    raw.tcp_fast_open = true;
                    raw.connect_timeout = "5s";
                    if (['vless', 'vmess', 'trojan'].includes(raw.type)) {
                        raw.tcp_keep_alive = "30s";
                        raw.tcp_keep_alive_interval = "5s";
                        raw.udp_fragment = true;
                        if (raw.type === 'vless') raw.packet_encoding = "xudp";
                    }
                    if (raw.transport && raw.transport.type === 'ws') {
                        raw.transport.max_early_data = 2560;
                        raw.transport.early_data_header_name = "Sec-WebSocket-Protocol";
                    }
                    if (raw.tls && !raw.tls.ech) raw.tls.ech = { enabled: false };
                    finalNodes.push(raw);
                }
                const nodeTags = finalNodes.map(n => n.tag);
                const directOutbound = { "type": "direct", "tag": "DIRECT", "domain_resolver": "alidns-quic" };
                const proxySelector = {
                    "type": "selector",
                    "tag": "PROXY",
                    "outbounds": nodeTags.length > 0 ? ["🟢 自动-测速", "🔵 自动-稳定", ...nodeTags,
                    "DIRECT"] : ["🟢 自动-测速", "🔵 自动-稳定", "DIRECT"],
                    "default": "🟢 自动-测速"
                };
                const autoSpeed = {
                    "type": "urltest", "tag": "🟢 自动-测速", "outbounds": nodeTags,
                    "url": "http://www.gstatic.com/generate_204", "interval": "10m0s", "tolerance": 100,
                    "idle_timeout": "30m0s"
                };
                const autoStable = {
                    "type": "urltest", "tag": "🔵 自动-稳定", "outbounds": nodeTags,
                    "url": "http://www.gstatic.com/generate_204", "interval": "15m0s", "tolerance": 30,
                    "idle_timeout": "1h0m0s"
                };
                const globalSelector = { "type": "selector", "tag": "GLOBAL", "outbounds": ["PROXY", "DIRECT"],
                    "default": "PROXY" };
                const cnSelector = { "type": "selector", "tag": "CN", "outbounds": ["DIRECT", "PROXY"],
                "default": "DIRECT" };
                const finalSelector = { "type": "selector", "tag": "Final", "outbounds": ["PROXY", "DIRECT",
                        "REJECT-DROP"
                    ], "default": "PROXY" };
                const rejectBlock = { "type": "block", "tag": "REJECT-DROP" };
                return [directOutbound, proxySelector, autoSpeed, autoStable, globalSelector, cnSelector,
                    finalSelector, rejectBlock, ...finalNodes
                ];
            }

            // ========== UI交互 ==========
            const inputArea = document.getElementById('inputArea');
            const outputPre = document.getElementById('outputConfig');
            const nodeBadge = document.getElementById('nodeCountBadge');
            const feedbackDiv = document.getElementById('copyFeedback');

            function showFeedback(msg) {
                feedbackDiv.innerHTML = `<span class="toast-msg">${msg}</span>`;
                setTimeout(() => feedbackDiv.innerHTML = '', 2500);
            }

            document.getElementById('convertBtn').addEventListener('click', () => {
                try {
                    const raw = inputArea.value.trim();
                    if (!raw) throw new Error('请输入节点链接');
                    const lines = raw.split(/\n/);
                    const rawNodes = [];
                    for (let line of lines) {
                        const node = parseLine(line);
                        if (node) rawNodes.push(node);
                    }
                    if (rawNodes.length === 0) throw new Error('未识别到有效节点');
                    const outbounds = buildOutbounds(rawNodes);
                    const config = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                    config.outbounds = outbounds;
                    outputPre.textContent = JSON.stringify(config, null, 2);
                    nodeBadge.textContent = `${rawNodes.length} 个节点`;
                    showFeedback(`✅ 成功解析 ${rawNodes.length} 个节点，配置已生成`);
                } catch (e) {
                    alert('转换失败: ' + e.message);
                    outputPre.textContent = '// 解析错误: ' + e.message;
                    nodeBadge.textContent = '0 个节点';
                }
            });

            document.getElementById('copyBtn').addEventListener('click', async () => {
                const text = outputPre.textContent;
                if (!text || text.startsWith('//')) { showFeedback('无有效配置可复制'); return; }
                try {
                    await navigator.clipboard.writeText(text);
                    showFeedback('📋 配置已复制到剪贴板');
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showFeedback('📋 复制成功');
                }
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                inputArea.value = '';
                outputPre.textContent = '// 点击「解析并生成配置」后显示完整 JSON …';
                nodeBadge.textContent = '0 个节点';
                feedbackDiv.innerHTML = '';
            });

            const sampleText =
                `vless://a8ceaac6-bda6-459e-ace7-0b34c5873e1e@www.visa.com:443?type=ws&path=%2Fpkpk-vl&host=example.372164885.xyz&security=tls&sni=example.372164885.xyz&fp=chrome#🚀-CF-Visa
vmess://eyJ2IjogIjIiLCAicHMiOiAiVk1lc3MtV1MiLCAiYWRkIjogImV4YW1wbGUuY29tIiwgInBvcnQiOiA0NDMsICJpZCI6ICJhOGNlYWFjNi1iZGE2LTQ1OWUtYWNlNy0wYjM0YzU4NzNlMWUiLCAiYWlkIjogMCwgIm5ldCI6ICJ3cyIsICJ0eXBlIjogIm5vbmUiLCAiaG9zdCI6ICJleGFtcGxlLmNvbSIsICJwYXRoIjogIi93cyIsICJ0bHMiOiAidGxzIn0=
trojan://password@trojan.example.com:443?sni=trojan.example.com#Trojan-Node
ss://YWVzLTI1Ni1nY206cGFzc3dvcmQ=@1.2.3.4:8388#SS-Node
hysteria2://letmein@hy2.example.com:443?sni=hy2.example.com&insecure=0#Hysteria2-Node`;
            document.getElementById('sampleBtn').addEventListener('click', () => {
                inputArea.value = sampleText;
            });

            inputArea.value = '';
            outputPre.textContent = '// 点击「解析并生成配置」后显示完整 JSON …';
            nodeBadge.textContent = '0 个节点';
        })();
    </script>
