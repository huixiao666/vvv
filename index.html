        function parseVless(url) {
            let main = url.substring(8);
            let fragment = '';
            const hash = main.indexOf('#');
            if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1)); main = main.substring(0, hash); }
            const qIdx = main.indexOf('?');
            let serverPart = main, query = '';
            if (qIdx !== -1) { serverPart = main.substring(0, qIdx); query = main.substring(qIdx + 1); }
            const at = serverPart.indexOf('@');
            if (at === -1) throw new Error('Invalid VLESS');
            const uuid = serverPart.substring(0, at);
            const hostPort = serverPart.substring(at + 1);
            let server, port;
            const col = hostPort.lastIndexOf(':');
            if (col !== -1) { server = hostPort.substring(0, col); port = parseInt(hostPort.substring(col + 1)); } else { server = hostPort; port = 443; }
            const params = new URLSearchParams(query);
            const type = params.get('type') || 'tcp';
            const security = params.get('security') || 'none';
            const flow = params.get('flow') || '';
            const sni = params.get('sni') || params.get('peer') || server;
            const fp = params.get('fp') || (security === 'tls' ? 'chrome' : undefined);
            let path = params.get('path') || '/';
            try { path = decodeURIComponent(path); } catch (e) {}
            const host = params.get('host') || sni;
            const serviceName = params.get('serviceName') || '';
            const pbk = params.get('pbk') || '';
            const sid = params.get('sid') || '';
            const rawTag = fragment || `${server}:${port}`;
            const node = { _rawTag: rawTag, type: 'vless', server, server_port: port, uuid, domain_resolver: 'local-dns', tcp_fast_open: true, connect_timeout: "5s", tcp_keep_alive: "30s", tcp_keep_alive_interval: "5s", udp_fragment: true };
            if (flow) node.flow = flow;
            if (type !== 'tcp') {
                const transport = { type };
                if (type === 'ws') { transport.path = path; if (host) transport.headers = { Host: host }; }
                else if (type === 'grpc') transport.service_name = serviceName;
                else if (type === 'httpupgrade') { transport.path = path; if (host) transport.host = host; }
                node.transport = transport;
            }
            if (security === 'tls') {
                node.tls = { enabled: true, server_name: sni, ech: { enabled: false } };
                if (fp) node.tls.utls = { enabled: true, fingerprint: fp };
            } else if (security === 'reality') {
                node.tls = { enabled: true, server_name: sni, reality: { enabled: true }, ech: { enabled: false } };
                if (pbk) node.tls.reality.public_key = pbk;
                if (sid) node.tls.reality.short_id = sid;
                if (fp) node.tls.utls = { enabled: true, fingerprint: fp };
            }
            return node;
        }

            const host = params.get('host') || sni;
            const rawTag = fragment || `${server}:${port}`;
            const node = { _rawTag: rawTag, type: 'trojan', server, server_port: port, password, domain_resolver: 'local-dns', tcp_fast_open: true, connect_timeout: "5s", tcp_keep_alive: "30s", tcp_keep_alive_interval: "5s", udp_fragment: true };
            if (type !== 'tcp') {
                const transport = { type };
                if (type === 'ws') { transport.path = path; if (host) transport.headers = { Host: host }; }
                node.transport = transport;
            }
            node.tls = { enabled: true, server_name: sni, ech: { enabled: false } };
            if (fp) node.tls.utls = { enabled: true, fingerprint: fp };
            return node;
        }
        function parseShadowsocks(url) {
            let main = url.substring(5);
            let fragment = '';
            const hash = main.indexOf('#');
            if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1)); main = main.substring(0, hash); }
            let method, password, server, port;
            if (main.includes('@')) {
                const at = main.lastIndexOf('@');
                const userInfo = main.substring(0, at);
                const hostPort = main.substring(at + 1);
                const decoded = atob(userInfo);
                const colon = decoded.indexOf(':');
                method = decoded.substring(0, colon);
                password = decoded.substring(colon + 1);
                const col = hostPort.lastIndexOf(':');
                server = col !== -1 ? hostPort.substring(0, col) : hostPort;
                port = col !== -1 ? parseInt(hostPort.substring(col + 1)) : 8388;
            } else { const decoded = atob(main); const parts = decoded.split('@'); const mp = parts[0].split(':'); method = mp[0]; password = mp[1]; const hp = parts[1].split(':'); server = hp[0]; port = parseInt(hp[1]); }
            const rawTag = fragment || `${server}:${port}`;
            return { _rawTag: rawTag, type: 'shadowsocks', server, server_port: port, method, password, domain_resolver: 'local-dns', connect_timeout: "5s", tcp_fast_open: true };
        }
        function parseHysteria2(url) {
            let u = url.startsWith('hysteria2://') ? url : url.replace('hy2://', 'hysteria2://');
            let main = u.substring(12);
            let fragment = '';
            const hash = main.indexOf('#');
            if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1)); main = main.substring(0, hash); }
            const at = main.indexOf('@');
            if (at === -1) throw new Error('Invalid Hysteria2');
            const password = main.substring(0, at);
            const hostPort = main.substring(at + 1);
            const qm = hostPort.indexOf('?');
            let server, port, query = '';
            if (qm !== -1) { const hp = hostPort.substring(0, qm); query = hostPort.substring(qm + 1); const col = hp.lastIndexOf(':'); if (col !== -1) { server = hp.substring(0, col); port = parseInt(hp.substring(col + 1)); } else { server = hp; port = 443; } }
            else { const col = hostPort.lastIndexOf(':'); if (col !== -1) { server = hostPort.substring(0, col); port = parseInt(hostPort.substring(col + 1)); } else { server = hostPort; port = 443; } }
            const params = new URLSearchParams(query);
            const sni = params.get('sni') || server;
            const insecure = params.get('insecure') === '1';
            const rawTag = fragment || `${server}:${port}`;
            return { _rawTag: rawTag, type: 'hysteria2', server, server_port: port, password, domain_resolver: 'local-dns', tls: { enabled: true, server_name: sni, insecure, ech: { enabled: false } } };
        }
        function parseLine(line) {
            line = line.trim();
            if (!line) return null;
            try {
                if (line.startsWith('vless://')) return parseVless(line);
                if (line.startsWith('vmess://')) return parseVmess(line);
                if (line.startsWith('trojan://')) return parseTrojan(line);
                if (line.startsWith('ss://')) return parseShadowsocks(line);
                if (line.startsWith('hysteria2://') || line.startsWith('hy2://')) return parseHysteria2(line);
            } catch (e) { console.warn(e); return null; }
            return null;
        }

        function makeUniqueTag(baseName, usedTags) {
            let candidate = baseName.replace(/[^\w\u4e00-\u9fa5\-_.]/gu, '_').substring(0, 28);
            if (!candidate) candidate = 'node';
            let finalTag = candidate;
            let counter = 1;
            while (usedTags.has(finalTag)) { finalTag = `${candidate}-${counter++}`; }
            usedTags.add(finalTag);
            return finalTag;
        }

        // 构建 outbounds：顺序为 DIRECT, 节点列表, auto, proxy (selector)
        // 节点配置插入在 DIRECT 之后，proxy selector 之前
        function buildOutbounds(nodeObjects) {
            const usedTags = new Set(['DIRECT', 'proxy', 'auto', '节点名称']);
            const builtNodes = [];
            for (let raw of nodeObjects) {
                const baseTag = raw._rawTag || 'node';
                delete raw._rawTag;
                const uniqueTag = makeUniqueTag(baseTag, usedTags);
                raw.tag = uniqueTag;
                builtNodes.push(raw);
            }
            const nodeTags = builtNodes.map(n => n.tag);
            // 固定出站：DIRECT
            const direct = { type: "direct", tag: "DIRECT" };
            // 自动测速
            let autoUrltest;
            if (nodeTags.length) {
                autoUrltest = { type: "urltest", tag: "auto", outbounds: nodeTags, url: "http://www.gstatic.com/generate_204", interval: "10m0s" };
            } else {
                autoUrltest = { type: "urltest", tag: "auto", outbounds: ["DIRECT"], url: "http://www.gstatic.com/generate_204", interval: "10m0s" };
            }
            // proxy selector
            const proxySelector = {
                type: "selector",
                tag: "proxy",
                outbounds: nodeTags.length ? ["auto", ...nodeTags, "DIRECT"] : ["DIRECT"],
                default: "auto"
            };
            // 组装顺序：DIRECT, 节点列表, auto, proxy
            const outbounds = [direct];
            if (builtNodes.length) outbounds.push(...builtNodes);
            outbounds.push(autoUrltest);
            outbounds.push(proxySelector);
            return outbounds;
        }

        function generateConfig(nodeLines) {
            const rawNodes = [];
            for (let line of nodeLines) {
                const node = parseLine(line);
                if (node) rawNodes.push(node);
            }
            if (rawNodes.length === 0) throw new Error('未识别到任何有效节点，请检查链接格式');
            const newOutbounds = buildOutbounds(rawNodes);
            const finalConfig = JSON.parse(JSON.stringify(BASE_TEMPLATE));
            finalConfig.outbounds = newOutbounds;
            return { config: finalConfig, nodeCount: rawNodes.length };
        }

        // DOM 交互
        const inputArea = document.getElementById('nodeInput');
        const outputPre = document.getElementById('outputConfig');
        const nodeBadge = document.getElementById('nodeCountBadge');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const sampleBtn = document.getElementById('sampleBtn');
        const infoMsgDiv = document.getElementById('infoMsg');
        const copyFeedback = document.getElementById('copyFeedback');

        function showMessage(msg, isErr = false) {
            infoMsgDiv.innerHTML = `<span style="background:#eef2fa; padding:5px 14px; border-radius:40px; color:${isErr ? '#b91c1c' : '#166534'};">${msg}</span>`;
            setTimeout(() => { if (infoMsgDiv.innerHTML.includes(msg)) infoMsgDiv.innerHTML = ''; }, 3000);
        }
        function updateBadge(count) { nodeBadge.textContent = count ? `📡 ${count} 个节点` : `⚙️ 等待转换`; }
        convertBtn.addEventListener('click', () => {
            try {
                const rawText = inputArea.value.trim();
                if (!rawText) throw new Error('请在左侧粘贴节点链接');
                const lines = rawText.split(/\r?\n/).filter(l => l.trim().length > 0);
                const { config, nodeCount } = generateConfig(lines);
                outputPre.textContent = JSON.stringify(config, null, 2);
                updateBadge(nodeCount);
                showMessage(`✅ 成功生成配置，共 ${nodeCount} 个节点`);
            } catch (err) {
                outputPre.textContent = `// 解析失败: ${err.message}`;
                updateBadge(0);
                showMessage(`❌ ${err.message}`, true);
            }
        });
        clearBtn.addEventListener('click', () => {
            inputArea.value = '';
            outputPre.textContent = '// 点击「解析并生成配置」后显示完整 JSON';
            updateBadge(0);
            infoMsgDiv.innerHTML = '';
            copyFeedback.innerHTML = '';
        });
        copyBtn.addEventListener('click', async () => {
            const text = outputPre.textContent;
            if (!text || text.startsWith('//')) { showMessage('没有可复制的配置', true); return; }
            try { await navigator.clipboard.writeText(text); copyFeedback.innerHTML = '<span class="toast">📋 配置已复制</span>'; setTimeout(() => copyFeedback.innerHTML = '', 2000); }
            catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); copyFeedback.innerHTML = '<span class="toast">📋 复制成功</span>'; setTimeout(() => copyFeedback.innerHTML = '', 2000); }
        });
        sampleBtn.addEventListener('click', () => {
            inputArea.value = `vless://a8ceaac6-bda6-459e-ace7-0b34c5873e1e@example.com:443?type=ws&path=%2Fws&security=tls&sni=example.com&fp=chrome#🇺🇸-示例节点
vmess://eyJ2IjoiMiIsInBzIjoiVk1lc3MtRXhhbXBsZSIsImFkZCI6InZtZXNzLmV4YW1wbGUuY29tIiwicG9ydCI6NDQzLCJpZCI6ImE4Y2VhYWM2LWJkYTYtNDU5ZS1hY2U3LTBiMzRjNTg3M2UxZSIsImFpZCI6MCwibmV0Ijoid3MiLCJ0eXBlIjoibm9uZSIsImhvc3QiOiJ2bWVzcy5leGFtcGxlLmNvbSIsInBhdGgiOiIvd21lc3MiLCJ0bHMiOiJ0bHMifQo=`;
            showMessage('示例节点已填入，点击转换即可');
        });
        outputPre.textContent = '// 等待转换...';
        updateBadge(0);
    })();
</script>
