    <style>

        }

            font-weight: 700;

            background-clip: text;
            color: transparent;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }

        .sub {
            color: #475569;
            margin-bottom: 28px;
            border-left: 4px solid #2c5f8a;
            padding-left: 16px;
            font-weight: 500;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 32px;

            padding: 24px 28px;
            margin-bottom: 28px;
            border: 1px solid #e2edf2;
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        label {
            font-weight: 600;
            color: #1e293b;
            font-size: 1rem;
        }

            width: 100%;
            padding: 16px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            background: #fff;
            border: 1.5px solid #cbd5e1;
            border-radius: 20px;
            min-height: 150px;
            resize: vertical;
            transition: 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #2c5f8a;
            box-shadow: 0 0 0 3px rgba(44, 95, 138, 0.15);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

            background: #1e3a5f;
            border-color: #1e3a5f;
            color: white;
        }

        .btn-primary:hover {
            background: #0f2b44;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #2c5f8a;
            border-color: #2c5f8a;
            color: white;
        }

        .btn-success:hover {
            background: #1f4a6e;
        }

        .btn-outline:hover {
            background: #eef2ff;
            border-color: #8fbbd9;
        }

        .output-panel {
            margin-top: 8px;
        }

        .output-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .badge {
            background: #e2e8f0;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        pre {
            background: #0e1e2a;
            color: #eef4ff;
            padding: 22px;
            border-radius: 24px;
            overflow-x: auto;
            font-size: 0.78rem;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            max-height: 560px;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #2c4c6e;

            color: #0f3b2c;
            background: #dcfce7;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;

            justify-content: space-between;

<body>
<div class="container">
    <h1>⚡ 多协议 → Sing-Box 转换器</h1>
    <div class="sub">基于「备用.json」完整框架 · 动态生成节点 · 无预置节点</div>

    <div class="card">
        <div class="input-header">
            <label>📎 粘贴节点链接 (每行一个，支持 vless / vmess / trojan / ss / hysteria2)</label>
            <button class="btn btn-outline" id="sampleBtn" style="padding: 6px 18px;">📋 填入示例</button>
        </div>
        <textarea id="nodeInput" placeholder="vless://...&#10;vmess://...&#10;trojan://...&#10;ss://...&#10;hysteria2://..."></textarea>
        <div class="button-group">
            <button class="btn btn-primary" id="convertBtn">✨ 解析并生成配置</button>
            <button class="btn btn-outline" id="clearBtn">🧹 清空</button>
        </div>
        <div id="infoMsg" style="margin-top: 12px;"></div>
    </div>

    <div class="card output-panel">
        <div class="output-toolbar">
            <span class="badge" id="nodeCountBadge">⚙️ 等待转换</span>
            <button class="btn btn-success" id="copyBtn">📋 一键复制配置</button>
        </div>
        <pre id="outputConfig">// 点击「解析并生成配置」后显示完整 JSON</pre>
        <div id="copyFeedback" style="height: 28px; margin-top: 12px;"></div>
    </div>
    <div class="footnote">
        ✅ 基于备用.json 完整结构 (DNS / 入站 / 路由 / 实验性)  <br>
        🚀 自动生成 PROXY 选择器 + 自动测速组，节点标签自动去重，严格对齐 1.14+ 语法。
    </div>
</div>

                    { "type": "remote", "tag": "telegram", "url": "https://cdn.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-telegram.srs", "http_client": "default", "update_interval": "48h0m0s" },
                    { "type": "remote", "tag": "instagram", "url": "https://cdn.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-instagram.srs", "http_client": "default", "update_interval": "48h0m0s" },
                    { "type": "remote", "tag": "Google", "url": "https://cdn.jsdelivr.net/gh/senshinya/singbox_ruleset@main/rule/Google/Google.srs", "http_client": "default", "update_interval": "48h0m0s" },
                    { "type": "remote", "tag": "GlobalMedia", "url": "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@sing/geo/geosite/category-entertainment.srs", "http_client": "default", "update_interval": "48h0m0s" }
                ],
                "final": "Final",
                "auto_detect_interface": true,
                "default_domain_resolver": "alidns-quic"
            },
            "experimental": {
                "cache_file": { "enabled": true, "path": "cache.db", "cache_id": "cinchov", "store_fakeip": true, "store_dns": true },
                "clash_api": { "external_controller": "127.0.0.1:9090", "external_ui": "ui", "default_mode": "rule" },
                "debug": { "gc_percent": 100, "memory_limit": "400MB" }
            }
        };

        // ---------- 2. 协议解析器 (与标准生成器一致) ----------
        function parseVless(url) {
            let main = url.substring(8);
            let fragment = '';
            const hash = main.indexOf('#');
            if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1)); main = main.substring(0, hash); }
            const qIdx = main.indexOf('?');
            let serverPart = main, query = '';
            if (qIdx !== -1) { serverPart = main.substring(0, qIdx); query = main.substring(qIdx + 1); }
            const at = serverPart.indexOf('@');
            if (at === -1) throw new Error('Invalid VLESS');
            const uuid = serverPart.substring(0, at);
            const hostPort = serverPart.substring(at + 1);
            let server, port;
            const col = hostPort.lastIndexOf(':');
            if (col !== -1) { server = hostPort.substring(0, col); port = parseInt(hostPort.substring(col + 1)); } else { server = hostPort; port = 443; }
            const params = new URLSearchParams(query);
            const type = params.get('type') || 'tcp';
            const security = params.get('security') || 'none';
            const flow = params.get('flow') || '';
            const sni = params.get('sni') || params.get('peer') || server;
            const fp = params.get('fp') || (security === 'tls' ? 'chrome' : undefined);
            let path = params.get('path') || '/';
            try { path = decodeURIComponent(path); } catch (e) {}
            const host = params.get('host') || sni;
            const serviceName = params.get('serviceName') || '';
            const pbk = params.get('pbk') || '';
            const sid = params.get('sid') || '';
            const rawTag = fragment || `${server}:${port}`;
            const node = { _rawTag: rawTag, type: 'vless', server, server_port: port, uuid, domain_resolver: 'alidns-quic', tcp_fast_open: true, connect_timeout: "5s", tcp_keep_alive: "30s", tcp_keep_alive_interval: "5s", udp_fragment: true };
            if (flow) node.flow = flow;
            if (type !== 'tcp') {
                const transport = { type };
                if (type === 'ws') { transport.path = path; if (host) transport.headers = { Host: host }; }
                else if (type === 'grpc') transport.service_name = serviceName;
                else if (type === 'httpupgrade') { transport.path = path; if (host) transport.host = host; }
                node.transport = transport;
            }
            if (security === 'tls') {
                node.tls = { enabled: true, server_name: sni, ech: { enabled: false } };
                if (fp) node.tls.utls = { enabled: true, fingerprint: fp };
            } else if (security === 'reality') {
                node.tls = { enabled: true, server_name: sni, reality: { enabled: true }, ech: { enabled: false } };
                if (pbk) node.tls.reality.public_key = pbk;
                if (sid) node.tls.reality.short_id = sid;
                if (fp) node.tls.utls = { enabled: true, fingerprint: fp };
            }
            return node;
        }
        function parseVmess(url) {
            const b64 = url.substring(8);
            const vm = JSON.parse(atob(b64));
            const rawTag = vm.ps || `${vm.add}:${vm.port}`;
            const node = { _rawTag: rawTag, type: 'vmess', server: vm.add, server_port: parseInt(vm.port) || 443, uuid: vm.id, security: vm.scy || 'auto', alter_id: parseInt(vm.aid) || 0, domain_resolver: 'alidns-quic', tcp_fast_open: true, connect_timeout: "5s", tcp_keep_alive: "30s", tcp_keep_alive_interval: "5s", udp_fragment: true };
            const net = vm.net;
            if (net && net !== 'tcp') {
                const transport = { type: net };
                if (net === 'ws') { transport.path = vm.path || '/'; if (vm.host) transport.headers = { Host: vm.host }; }
                else if (net === 'grpc') transport.service_name = vm.path || '';
                else if (net === 'h2') { transport.type = 'http'; transport.host = vm.host ? [vm.host] : undefined; transport.path = vm.path; }
                node.transport = transport;
            }
            if (vm.tls === 'tls') {
                node.tls = { enabled: true, server_name: vm.sni || vm.add, ech: { enabled: false } };
                if (vm.fingerprint) node.tls.utls = { enabled: true, fingerprint: vm.fingerprint };
            }
            return node;
        }
        function parseTrojan(url) {
            let main = url.substring(9);
            let fragment = '';
            const hash = main.indexOf('#');
            if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1)); main = main.substring(0, hash); }
            const at = main.indexOf('@');
            if (at === -1) throw new Error('Invalid Trojan');
            const password = main.substring(0, at);
            const hostPort = main.substring(at + 1);
            const qm = hostPort.indexOf('?');
            let server, port, query = '';
            if (qm !== -1) { const hp = hostPort.substring(0, qm); query = hostPort.substring(qm + 1); const col = hp.lastIndexOf(':'); if (col !== -1) { server = hp.substring(0, col); port = parseInt(hp.substring(col + 1)); } else { server = hp; port = 443; } }
            else { const col = hostPort.lastIndexOf(':'); if (col !== -1) { server = hostPort.substring(0, col); port = parseInt(hostPort.substring(col + 1)); } else { server = hostPort; port = 443; } }
            const params = new URLSearchParams(query);
            const sni = params.get('sni') || server;
            const fp = params.get('fp') || 'chrome';
            const type = params.get('type') || 'tcp';
            const path = params.get('path') || '/';
            const host = params.get('host') || sni;
            const rawTag = fragment || `${server}:${port}`;
            const node = { _rawTag: rawTag, type: 'trojan', server, server_port: port, password, domain_resolver: 'alidns-quic', tcp_fast_open: true, connect_timeout: "5s", tcp_keep_alive: "30s", tcp_keep_alive_interval: "5s", udp_fragment: true };
            if (type !== 'tcp') {
                const transport = { type };
                if (type === 'ws') { transport.path = path; if (host) transport.headers = { Host: host }; }
                node.transport = transport;
            }
            node.tls = { enabled: true, server_name: sni, ech: { enabled: false } };
            if (fp) node.tls.utls = { enabled: true, fingerprint: fp };
            return node;
        }
        function parseShadowsocks(url) {
            let main = url.substring(5);
            let fragment = '';
            const hash = main.indexOf('#');
            if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1)); main = main.substring(0, hash); }
            let method, password, server, port;
            if (main.includes('@')) {
                const at = main.lastIndexOf('@');
                const userInfo = main.substring(0, at);
                const hostPort = main.substring(at + 1);
                const decoded = atob(userInfo);
                const colon = decoded.indexOf(':');
                method = decoded.substring(0, colon);
                password = decoded.substring(colon + 1);
                const col = hostPort.lastIndexOf(':');
                server = col !== -1 ? hostPort.substring(0, col) : hostPort;
                port = col !== -1 ? parseInt(hostPort.substring(col + 1)) : 8388;
            } else {
                const decoded = atob(main);
                const parts = decoded.split('@');
                const mp = parts[0].split(':');
                method = mp[0];
                password = mp[1];
                const hp = parts[1].split(':');
                server = hp[0];
                port = parseInt(hp[1]);
            }
            const rawTag = fragment || `${server}:${port}`;
            return { _rawTag: rawTag, type: 'shadowsocks', server, server_port: port, method, password, domain_resolver: 'alidns-quic', connect_timeout: "5s", tcp_fast_open: true };
        }
        function parseHysteria2(url) {
            let u = url.startsWith('hysteria2://') ? url : url.replace('hy2://', 'hysteria2://');
            let main = u.substring(12);
            let fragment = '';
            const hash = main.indexOf('#');
            if (hash !== -1) { fragment = decodeURIComponent(main.substring(hash + 1)); main = main.substring(0, hash); }
            const at = main.indexOf('@');
            if (at === -1) throw new Error('Invalid Hysteria2');
            const password = main.substring(0, at);
            const hostPort = main.substring(at + 1);
            const qm = hostPort.indexOf('?');
            let server, port, query = '';
            if (qm !== -1) { const hp = hostPort.substring(0, qm); query = hostPort.substring(qm + 1); const col = hp.lastIndexOf(':'); if (col !== -1) { server = hp.substring(0, col); port = parseInt(hp.substring(col + 1)); } else { server = hp; port = 443; } }
            else { const col = hostPort.lastIndexOf(':'); if (col !== -1) { server = hostPort.substring(0, col); port = parseInt(hostPort.substring(col + 1)); } else { server = hostPort; port = 443; } }
            const params = new URLSearchParams(query);
            const sni = params.get('sni') || server;
            const insecure = params.get('insecure') === '1';
            const rawTag = fragment || `${server}:${port}`;
            return { _rawTag: rawTag, type: 'hysteria2', server, server_port: port, password, domain_resolver: 'alidns-quic', tls: { enabled: true, server_name: sni, insecure, ech: { enabled: false } } };
        }
        function parseLine(line) {
            line = line.trim();
            if (!line) return null;
            try {
                if (line.startsWith('vless://')) return parseVless(line);
                if (line.startsWith('vmess://')) return parseVmess(line);
                if (line.startsWith('trojan://')) return parseTrojan(line);
                if (line.startsWith('ss://')) return parseShadowsocks(line);
                if (line.startsWith('hysteria2://') || line.startsWith('hy2://')) return parseHysteria2(line);
            } catch (e) { console.warn(e); return null; }
            return null;
        }

        // 标签去重
        function makeUniqueTag(baseName, usedTags) {
            let candidate = baseName.replace(/[^\w\u4e00-\u9fa5\u{1F300}-\u{1FAFF}\-_.]/gu, '_').substring(0, 28);
            if (!candidate) candidate = 'node';
            let finalTag = candidate;
            let counter = 1;
            while (usedTags.has(finalTag)) { finalTag = `${candidate}-${counter++}`; }
            usedTags.add(finalTag);
            return finalTag;
        }

        // 动态构建 outbounds (基于备用样式)
        function buildOutbounds(nodeObjects) {
            const usedTags = new Set(['DIRECT', 'PROXY', 'GLOBAL', 'CN', 'Final', 'REJECT-DROP', '🟣 QUIC-UDP']);
            const builtNodes = [];
            for (let raw of nodeObjects) {
                const baseTag = raw._rawTag || 'node';
                delete raw._rawTag;
                const uniqueTag = makeUniqueTag(baseTag, usedTags);
                raw.tag = uniqueTag;
                builtNodes.push(raw);
            }
            const nodeTags = builtNodes.map(n => n.tag);
            // 基础固定出口 (与备用.json风格对齐)
            const direct = { type: "direct", tag: "DIRECT", domain_resolver: "alidns-quic" };
            const quicSelector = { type: "selector", tag: "🟣 QUIC-UDP", outbounds: nodeTags.length ? nodeTags.slice(0,3) : ["DIRECT"], default: nodeTags[0] || "DIRECT" };
            const globalSel = { type: "selector", tag: "GLOBAL", outbounds: ["PROXY","DIRECT"], default: "PROXY" };
            const cnSel = { type: "selector", tag: "CN", outbounds: ["DIRECT","PROXY"], default: "DIRECT" };
            const finalSel = { type: "selector", tag: "Final", outbounds: ["PROXY","DIRECT","REJECT-DROP"], default: "PROXY" };
            const rejectBlock = { type: "block", tag: "REJECT-DROP" };
            let autoUrltest = null;
            let proxySelector = null;
            if (nodeTags.length) {
                autoUrltest = { type: "urltest", tag: "🟢 自动-测速", outbounds: nodeTags, url: "http://www.gstatic.com/generate_204", interval: "10m0s", tolerance: 100, idle_timeout: "30m0s" };
                proxySelector = { type: "selector", tag: "PROXY", outbounds: ["🟢 自动-测速", ...nodeTags, "DIRECT"], default: "🟢 自动-测速" };
            } else {
                proxySelector = { type: "selector", tag: "PROXY", outbounds: ["DIRECT"], default: "DIRECT" };
            }
            const outbounds = [direct];
            if (proxySelector) outbounds.push(proxySelector);
            if (autoUrltest) outbounds.push(autoUrltest);
            outbounds.push(quicSelector, globalSel, cnSel, finalSel, rejectBlock);
            if (builtNodes.length) outbounds.push(...builtNodes);
            return outbounds;
        }

        // 核心转换逻辑
        function generateConfig(nodeLines) {
            const rawNodes = [];
            for (let line of nodeLines) {
                const node = parseLine(line);
                if (node) rawNodes.push(node);
            }
            if (rawNodes.length === 0) throw new Error('未识别到任何有效节点');
            const newOutbounds = buildOutbounds(rawNodes);
            const finalConfig = JSON.parse(JSON.stringify(BASE_TEMPLATE));
            finalConfig.outbounds = newOutbounds;
            return { config: finalConfig, nodeCount: rawNodes.length };
        }

        // DOM 操作
        const inputArea = document.getElementById('nodeInput');
        const outputPre = document.getElementById('outputConfig');
        const nodeBadge = document.getElementById('nodeCountBadge');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const sampleBtn = document.getElementById('sampleBtn');
        const infoMsgDiv = document.getElementById('infoMsg');
        const copyFeedback = document.getElementById('copyFeedback');

        function showMessage(msg, isErr = false) {
            infoMsgDiv.innerHTML = `<span style="background:#eef2fa; padding:5px 14px; border-radius:40px; color:${isErr ? '#b91c1c' : '#166534'};">${msg}</span>`;
            setTimeout(() => { if (infoMsgDiv.innerHTML.includes(msg)) infoMsgDiv.innerHTML = ''; }, 3000);
        }
        function updateBadge(count) { nodeBadge.textContent = count ? `📡 ${count} 个节点` : `⚙️ 等待转换`; }
        convertBtn.addEventListener('click', () => {
            try {
                const rawText = inputArea.value.trim();
                if (!rawText) throw new Error('请在左侧粘贴节点链接');
                const lines = rawText.split(/\r?\n/).filter(l => l.trim().length > 0);
                const { config, nodeCount } = generateConfig(lines);
                outputPre.textContent = JSON.stringify(config, null, 2);
                updateBadge(nodeCount);
                showMessage(`✅ 成功生成配置，共 ${nodeCount} 个节点`);
            } catch (err) {
                outputPre.textContent = `// 解析失败: ${err.message}`;
                updateBadge(0);
                showMessage(`❌ ${err.message}`, true);
            }
        });
        clearBtn.addEventListener('click', () => {
            inputArea.value = '';
            outputPre.textContent = '// 点击「解析并生成配置」后显示完整 JSON';
            updateBadge(0);
            infoMsgDiv.innerHTML = '';
            copyFeedback.innerHTML = '';
        });
        copyBtn.addEventListener('click', async () => {
            const text = outputPre.textContent;
            if (!text || text.startsWith('//')) { showMessage('没有可复制的配置', true); return; }
            try { await navigator.clipboard.writeText(text); copyFeedback.innerHTML = '<span class="toast">📋 配置已复制</span>'; setTimeout(() => copyFeedback.innerHTML = '', 2000); }
            catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); copyFeedback.innerHTML = '<span class="toast">📋 复制成功</span>'; setTimeout(() => copyFeedback.innerHTML = '', 2000); }
        });
        sampleBtn.addEventListener('click', () => {
            inputArea.value = `vless://a8ceaac6-bda6-459e-ace7-0b34c5873e1e@example.com:443?type=ws&path=%2Fws&security=tls&sni=example.com&fp=chrome#🇺🇸-示例节点
vmess://eyJ2IjoiMiIsInBzIjoiVk1lc3MtRXhhbXBsZSIsImFkZCI6InZtZXNzLmV4YW1wbGUuY29tIiwicG9ydCI6NDQzLCJpZCI6ImE4Y2VhYWM2LWJkYTYtNDU5ZS1hY2U3LTBiMzRjNTg3M2UxZSIsImFpZCI6MCwibmV0Ijoid3MiLCJ0eXBlIjoibm9uZSIsImhvc3QiOiJ2bWVzcy5leGFtcGxlLmNvbSIsInBhdGgiOiIvd21lc3MiLCJ0bHMiOiJ0bHMifQo=`;
            showMessage('示例节点已填入，点击转换即可');
        });
        outputPre.textContent = '// 等待转换...';
        updateBadge(0);
    })();
